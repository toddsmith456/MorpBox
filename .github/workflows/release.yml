name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 36
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Tests
        run: gradle :youniversal:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      - name: APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Pack source
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          git archive --format=zip --prefix=MorpBox-${VERSION}/ HEAD -o MorpBox-${VERSION}-source.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            MorpBox-*-source.zip
